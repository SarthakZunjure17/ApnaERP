version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: apnaerp_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: apnaerp_db
    restart: always
    environment:
      POSTGRES_USER: apnaerp_user
      POSTGRES_PASSWORD: apnaerp_password
      POSTGRES_DB: apnaerp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: apnaerp_redis
    restart: always
    ports:
      - "6379:6379"

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: apnaerp_celery_worker
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    environment:
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - db

  prometheus:
    image: prom/prometheus:latest
    container_name: apnaerp_prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: apnaerp_grafana
    ports:
      - "3000:3000"

volumes:
  postgres_data:
