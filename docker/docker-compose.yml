version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: apnaerp_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - apnaerp_network

  db:
    image: postgres:15-alpine
    container_name: apnaerp_db
    restart: always
    environment:
      POSTGRES_USER: apnaerp_user
      POSTGRES_PASSWORD: apnaerp_password
      POSTGRES_DB: apnaerp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apnaerp_network

  redis:
    image: redis:7-alpine
    container_name: apnaerp_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apnaerp_network

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: apnaerp_celery_worker
    command: celery -A workers.celery_worker.celery_app worker --loglevel=info -Q default,high_priority,low_priority,periodic
    environment:
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started
    restart: always
    networks:
      - apnaerp_network

  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: apnaerp_celery_beat
    command: celery -A workers.celery_worker.celery_app beat --loglevel=info
    environment:
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started
    restart: always
    networks:
      - apnaerp_network

  prometheus:
    image: prom/prometheus:latest
    container_name: apnaerp_prometheus
    ports:
      - "9090:9090"
    networks:
      - apnaerp_network

  grafana:
    image: grafana/grafana:latest
    container_name: apnaerp_grafana
    ports:
      - "3000:3000"
    networks:
      - apnaerp_network

volumes:
  postgres_data:
  redis_data:

networks:
  apnaerp_network:
    driver: bridge
